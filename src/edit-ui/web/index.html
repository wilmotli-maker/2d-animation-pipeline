<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit</title>
<link rel="stylesheet" href="/static/edit.css">
</head>
<body>
<header class="top">
  <h1>Edit</h1>
  <button id="open-btn" title="Open a video file">Open video…</button>
  <span class="file" id="file-name"></span>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <span class="save" id="save-state"></span>
  <label class="inline" title="Extra evenly-spaced source frames added to the run. The seedance-draft generator ignores these (it uses start/end + your edited keyframes); leave at 0 unless experimenting.">Extra source frames <input type="number" id="auto-kf" min="0" max="12" value="0"></label>
  <label class="inline" title="After splicing, regenerate the clip (previz→restyle) to remove the splice seams. Costs ~2 extra Seedance generations per edit. Off by default."><input type="checkbox" id="opt-harmonize"> Harmonize</label>
  <button id="gen-video" class="primary" title="Generate the whole edited video">Generate video</button>
  <input type="file" id="open-input" accept="video/mp4,video/quicktime,video/webm,.mp4,.m4v,.mov,.webm" hidden>
  <input type="file" id="kf-input" accept="image/png,image/jpeg,image/webp" hidden>
</header>

<div class="layout">
  <section class="main">
    <div class="tools" id="tools">
      <div class="group">
        <button data-tool="none" title="Select / play (V)">Select</button>
        <button data-tool="pen" title="Scribble on the frame (B)">Pen</button>
        <button data-tool="erase" title="Erase strokes (E)">Erase</button>
      </div>
      <div class="group" id="swatches"></div>
      <div class="group">
        <label class="inline">Size <input type="range" id="pen-size" min="1" max="24" value="5"></label>
      </div>
      <div class="group">
        <label class="inline"><input type="checkbox" id="show-ann" checked> Annotations</label>
        <label class="inline"><input type="checkbox" id="show-kf" checked> Keyframes</label>
        <label class="inline blend" title="Blend between the source frame and the keyframe">Source <input type="range" id="kf-opacity" min="0" max="100" value="60"> Keyframe</label>
      </div>
      <div class="group right">
        <button id="undo" title="Undo (⌘Z)">Undo</button>
        <button id="redo" title="Redo (⇧⌘Z)">Redo</button>
      </div>
    </div>

    <div class="stage-wrap" id="stage-wrap">
      <div class="stage" id="stage">
        <video id="video" playsinline preload="auto"></video>
        <img id="kf-overlay" alt="">
        <canvas id="ink"></canvas>
        <div class="badge" id="view-badge"></div>
        <div class="pane-label" id="label-a">Source</div>
      </div>
      <div class="stage alt" id="stage2">
        <video id="video2" playsinline preload="auto" muted></video>
        <div class="pane-label" id="label-b">Result</div>
      </div>
      <div class="welcome" id="welcome">
        <h2>Open a video to edit</h2>
        <p class="dim">Drop a video file anywhere, or</p>
        <button class="primary" id="welcome-open">Choose a file…</button>
        <div id="recent"></div>
      </div>
      <div class="dropzone" id="dropzone">Drop to open</div>
      <div class="progress" id="progress"><div></div><span></span></div>
    </div>

    <div class="viewbar" id="viewbar">
      <span class="dim viewbar-label">View</span>
      <div class="seg">
        <button id="view-source" class="toggle">Source</button>
        <div class="seg-result" id="seg-result">
          <button id="view-result" class="toggle" type="button">Result</button>
          <select id="result-pick" title="Which generated result and output variant to show"></select>
        </div>
      </div>
      <button id="view-side-by-side" class="toggle" title="Show source and the selected result at the same time">Side by side</button>
    </div>

    <div class="transport">
      <button id="to-start" title="Start (Home)">⏮</button>
      <button id="step-back" title="Previous frame (←)">◀︎|</button>
      <button id="play" class="play" title="Play / pause (Space)">▶︎</button>
      <button id="step-fwd" title="Next frame (→)">|▶︎</button>
      <button id="to-end" title="End (End)">⏭</button>
      <button id="loop" class="toggle" title="Loop (L) — loops the selected range if one is selected">Loop</button>
      <button id="mute" class="toggle" title="Mute (U)">🔊</button>
      <span class="tc" id="tc">00:00.000</span>
      <span class="tc dim" id="fc">f 0</span>
      <span class="spacer"></span>
      <button id="mark-frame" title="Mark a region around this frame (M) — auto 4s, drag to extend">Mark region</button>
      <button id="mark-in" title="Set range in (I)">In</button>
      <button id="mark-out" title="Set range out — creates the range (O)">Out</button>
      <button id="add-kf" title="Add a keyframe at this frame (K)">+ Keyframe</button>
    </div>

    <div class="timeline" id="timeline">
      <div class="lane-labels">
        <div class="l-ruler">Time</div><div class="l-wave">Audio</div><div class="l-lane">Marks</div><div class="l-lane">Ink</div><div class="l-lane">Keys</div>
      </div>
      <div class="lanes" id="lanes">
        <div class="lane ruler" id="ruler"></div>
        <div class="lane wave" id="wave-lane"><canvas id="wave"></canvas><span class="dim no-audio" id="no-audio">no audio</span></div>
        <div class="lane marks" id="track" title="Drag to mark a range · click a mark to select"></div>
        <div class="lane ann" id="lane-ann"></div>
        <div class="lane kf" id="lane-kf"></div>
        <div class="pending-in" id="pending-in"></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </div>
  </section>

  <aside class="side">
    <section class="panel inspector" id="inspector"></section>
    <section class="panel">
      <header><h2>Marks</h2></header>
      <ul class="list" id="marks-list"></ul>
    </section>
    <section class="panel" id="dialogue-panel">
      <header><h2>Dialogue</h2><button id="transcribe-btn">Transcribe</button></header>
      <div id="dialogue"></div>
    </section>
    <section class="panel">
      <header><h2>Style lock</h2></header>
      <textarea id="style-lock" rows="2" placeholder="Describe the subject's locked design to preserve (e.g. 'a red cartoon dragon, pale belly, olive spines'). Optional — leave blank to preserve from the reference frames."></textarea>
      <header><h2>Whole-video prompts</h2><button id="add-global-prompt">+ Prompt</button></header>
      <div id="global-prompts"></div>
    </section>
    <section class="panel">
      <header><h2>Results</h2></header>
      <ul class="list" id="render-list"></ul>
    </section>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/static/app.js"></script>
</body></html>
